<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lifeline art preview</title>
  <style>
    body { background: #12101c; color: #c0cbdc; font: 12px/1.3 monospace; margin: 16px; }
    h2 { font-size: 14px; color: #feae34; margin: 18px 0 6px; }
    .grid { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; }
    .cell { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 4px; background: #1d1a2c; border-radius: 4px; }
    .cell span { font-size: 10px; color: #8b9bb4; }
    canvas { image-rendering: pixelated; }
    #warn { color: #ff6b6b; white-space: pre-wrap; }
  </style>
</head>
<body>
  <pre id="warn"></pre>
  <div id="root"></div>
  <script type="module" src="/src/render/art/preview.ts"></script>
</body>
</html>
